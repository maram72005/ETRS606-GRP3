<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYS_METEO // NEURAL_LINK</title>
    <style>
        /* === THEME CYBERPUNK === */
        :root {
            --neon-cyan: #00f3ff;
            --neon-pink: #ff00ea;
            --neon-yellow: #fcee0a;
            --neon-green: #39ff14;
            --bg-dark: #050508;
            --panel-bg: rgba(5, 10, 15, 0.8);
            --grid-color: rgba(0, 243, 255, 0.05);
            --glow-current: var(--neon-cyan); /* Modifié dynamiquement par JS */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            background-color: var(--bg-dark);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px 40px;
            overflow-x: hidden;
            position: relative;
        }

        /* Effet de Grille Matrix/Hacker */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 0;
            pointer-events: none;
        }

        /* Effet Scanline (Vieux moniteur CRT) */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .content { position: relative; z-index: 5; width: 100%; max-width: 480px; }

        /* Nav bar */
        .nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        .nav a {
            text-decoration: none;
            padding: 8px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            background: rgba(0, 243, 255, 0.1);
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }
        .nav a.active, .nav a:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        /* Hero / Header */
        .hero {
            text-align: center;
            padding: 20px 0 30px;
            border-bottom: 2px dashed rgba(255,255,255,0.2);
            margin-bottom: 20px;
        }
        .city-name {
            font-size: 1.5rem;
            color: var(--glow-current);
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 10px var(--glow-current);
        }
        .hero-temp {
            font-size: 6rem;
            font-weight: bold;
            margin: 10px 0;
            text-shadow: 2px 2px 0px #f00, -2px -2px 0px #0ff; /* Glitch effect */
        }
        .hero-condition {
            font-size: 1.2rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: var(--glow-current);
            color: #000;
            display: inline-block;
            padding: 5px 15px;
            margin-bottom: 10px;
        }
        .hero-range { font-size: 1rem; color: #aaa; }

        /* Cards */
        .cards-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid rgba(255,255,255,0.1);
            border-left: 4px solid var(--glow-current);
            padding: 15px;
            position: relative;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        
        .card::before { /* Décoration HUD */
            content: ''; position: absolute; top: 0; right: 0;
            width: 20px; height: 20px;
            border-top: 2px solid var(--glow-current); border-right: 2px solid var(--glow-current);
        }

        .card-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #888;
            margin-bottom: 10px;
        }
        .card-value {
            font-size: 2.2rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 8px rgba(255,255,255,0.5);
        }
        .card-unit { font-size: 1rem; color: var(--glow-current); }

        /* Verdict IA Panel */
        .card-verdict {
            grid-column: span 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-left-color: var(--neon-pink);
        }
        .card-verdict::before { border-color: var(--neon-pink); }
        
        .verdict-left .verdict-title {
            color: var(--neon-pink);
            font-weight: bold;
        }
        .verdict-label {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: glitch 3s infinite;
        }
        
        .verdict-right { text-align: right; }
        .verdict-confidence { font-size: 2.5rem; font-weight: bold; color: #fff; }
        .confidence-label { color: #888; text-transform: uppercase; font-size: 0.8rem; }

        @keyframes glitch {
            0% { transform: translate(0) }
            2% { transform: translate(-2px, 2px) }
            4% { transform: translate(2px, -2px) }
            6% { transform: translate(0) }
            100% { transform: translate(0) }
        }

        /* Terminal TalkBack */
        .card-talkback {
            border-left-color: var(--neon-yellow);
            font-size: 0.85rem;
        }
        .card-talkback::before { border-color: var(--neon-yellow); }
        .talkback-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 10px; }
        .tb-badge { background: var(--neon-yellow); color: #000; padding: 2px 8px; font-weight: bold; }
        
        .talkback-list { list-style: none; max-height: 200px; overflow-y: auto; }
        .talkback-list li {
            display: flex; justify-content: space-between; padding: 8px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
        }
        .talkback-list li::before { content: '>'; color: var(--neon-yellow); margin-right: 10px; }
        .tb-time { color: #666; }
        .tb-cmd { color: #fff; font-weight: bold; }

        .update-bar {
            text-align: center; font-size: 0.8rem; color: #555; margin-top: 20px;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .dot { width: 8px; height: 8px; background: var(--neon-green); display: inline-block; animation: blink 1s infinite; box-shadow: 0 0 5px var(--neon-green); }
        @keyframes blink { 0%, 100% { opacity: 1 } 50% { opacity: 0.2 } }

    </style>
</head>
<body>
    <div class="content">
        <nav class="nav">
            <a href="#" class="active">SYS_METEO</a>
            <a href="graphs.html">DATA_LOG</a>
        </nav>

        <div class="hero">
            <div class="city-name" id="station-name">NODE_UNKNOWN</div>
            <div class="hero-temp"><span id="temp">--</span><span style="font-size:3rem">°</span></div>
            <div class="hero-condition" id="hero-condition">AWAITING_DATA...</div>
            <div class="hero-range" id="hero-range">AI_CONFIDENCE: -- %</div>
        </div>

        <div class="cards-grid">
            <div class="card">
                <div class="card-label">SYS.HUMIDITY</div>
                <div class="card-value"><span id="hum">--</span><span class="card-unit"> %</span></div>
            </div>
            <div class="card">
                <div class="card-label">SYS.PRESSURE</div>
                <div class="card-value"><span id="press">--</span><span class="card-unit"> hPa</span></div>
            </div>
            
            <div class="card card-verdict">
                <div class="verdict-left">
                    <div class="card-label verdict-title">NEURAL_NET.OUT</div>
                    <div class="verdict-label" id="verdict">PROCESSING...</div>
                </div>
                <div class="verdict-right">
                    <div class="verdict-confidence"><span id="prob">--</span>%</div>
                    <div class="confidence-label">ACCURACY</div>
                </div>
            </div>
        </div>

        <div class="card card-talkback">
            <div class="talkback-header">
                <div class="card-label" style="margin-bottom:0">CMD_HISTORY // TALKBACK</div>
                <span class="tb-badge" id="tb-count">0</span>
            </div>
            <ul class="talkback-list" id="talkback-list">
                <li style="color:#666">CONNECTING TO SECURE SERVER...</li>
            </ul>
        </div>

        <div class="update-bar">
            <span class="dot"></span> LIVE LINK · LAST_SYNC: <strong id="heure" style="color:var(--neon-green)">--:--:--</strong>
        </div>
    </div>

    <script>
 let cfg = {};
        let currentThemeIndex = -1;

        const root = document.documentElement;

        // TES 5 CLASSES MÉTÉO (Dans le même ordre que ton code Python)
        // 0: Pluie, 1: Beau temps, 2: Nuageux, 3: Brouillard, 4: Vent fort
        const CONDITIONS = [
            { label:"PRECIPITATION", color:"#00f3ff" }, // Pluie (Neon Cyan)
            { label:"CLEAR_SKY",     color:"#fcee0a" }, // Beau temps (Neon Yellow)
            { label:"CLOUDY",        color:"#ffffff" }, // Nuageux (Blanc)
            { label:"FOG_DETECTED",  color:"#ff00ea" }, // Brouillard (Neon Pink)
            { label:"HIGH_WIND",     color:"#39ff14" }  // Vent fort (Neon Green)
        ];

        function setTheme(index) {
            if(index === currentThemeIndex) return;
            currentThemeIndex = index;
            const c = CONDITIONS[index];
            
            // Applique la couleur de glow dynamique à toute l'interface
            root.style.setProperty('--glow-current', c.color);
            
            document.getElementById('verdict').textContent = c.label;
            document.getElementById('verdict').style.color = c.color;
            document.getElementById('hero-condition').textContent = c.label;
        }

        async function loadConfig() {
            try {
                const r = await fetch('config.json');
                cfg = await r.json();
                document.getElementById('station-name').textContent = cfg.station.name;
            } catch(e) {
                // RENTRE TES INFORMATIONS THINGSPEAK ICI !
                cfg = {
                    thingspeak:{ 
                        channelID:'3339078', 
                        readAPIKey:'XHMJ0F02G7MPTHVV', 
                        talkbackID:'56761', 
                        talkbackAPIKey:'O2I7JJQEP5IIG4Y8' 
                    },
                    station:{ name:'STM32_CORTEX', refreshInterval:15000 }
                };
                document.getElementById('station-name').textContent = cfg.station.name;
            }
        }

        async function fetchMeteo() {
            const {channelID,readAPIKey} = cfg.thingspeak;
            try {
                const r = await fetch(`https://api.thingspeak.com/channels/${channelID}/feeds.json?api_key=${readAPIKey}&results=1`);
                const data = await r.json();
                if(!data.feeds?.length) return;
                const f = data.feeds[0];
                
                // Champs Capteurs
                if(f.field1) document.getElementById('temp').textContent=parseFloat(f.field1).toFixed(1);
                if(f.field2) document.getElementById('hum').textContent=parseFloat(f.field2).toFixed(0);
                if(f.field3) document.getElementById('press').textContent=parseFloat(f.field3).toFixed(0);
                
                // --- NOUVELLE LOGIQUE IA ---
                // On met les 5 champs de probabilités dans un tableau (si vide, on met 0)
                const probabilites = [
                    parseFloat(f.field4) || 0, // Index 0 : Pluie
                    parseFloat(f.field5) || 0, // Index 1 : Beau temps
                    parseFloat(f.field6) || 0, // Index 2 : Nuageux
                    parseFloat(f.field7) || 0, // Index 3 : Brouillard
                    parseFloat(f.field8) || 0  // Index 4 : Vent fort
                ];

                // On cherche la valeur maximum dans le tableau
                const maxProb = Math.max(...probabilites);
                
                // On cherche à quel index (quelle classe) correspond ce maximum
                const winningIndex = probabilites.indexOf(maxProb);

                // On met à jour l'affichage avec le gagnant
                if(maxProb > 0) {
                    document.getElementById('prob').textContent = maxProb.toFixed(1);
                    document.getElementById('hero-range').textContent = `AI_CONFIDENCE: ${maxProb.toFixed(1)} %`;
                    setTheme(winningIndex);
                }
                
                document.getElementById('heure').textContent=new Date(f.created_at).toLocaleTimeString();
            } catch(e){console.error('Sensor Link Error:',e);}
        }

        async function fetchTalkBack() {
            const {talkbackID,talkbackAPIKey} = cfg.thingspeak;
            if(!talkbackID || talkbackID === 'TON_TALKBACK_ID') return; 

            try {
                const r = await fetch(`https://api.thingspeak.com/talkbacks/${talkbackID}/commands.json?api_key=${talkbackAPIKey}`);
                const cmds = await r.json();
                const list = document.getElementById('talkback-list');
                document.getElementById('tb-count').textContent=cmds.length;
                list.innerHTML='';
                
                if(!cmds.length){
                    list.innerHTML='<li style="justify-content:center;color:#666">NO_COMMANDS_IN_QUEUE</li>';
                    return;
                }
                
                [...cmds].reverse().forEach(cmd=>{
                    const li=document.createElement('li');
                    const time=new Date(cmd.created_at).toLocaleTimeString();
                    li.innerHTML=`<span class="tb-cmd">${cmd.command_string}</span> <span class="tb-time">[${time}]</span>`;
                    list.appendChild(li);
                });
            } catch(e){console.error('TalkBack Error:',e);}
        }

        async function init() {
            await loadConfig();
            const refresh = () => { fetchMeteo(); fetchTalkBack(); };
            refresh();
            setInterval(refresh, cfg.station.refreshInterval);
        }
        init();
    </script>
</body>
</html>
